[package]
name = "notron"
version = "0.1.0"
description = "Notron is a modern, minimal yet powerful desktop code editor built with Tauri (Rust) and Svelte 5, powered by the CodeMirror 6 engine."
authors = ["Fazelllyyy (Zulfazli) <zulfazlilsm@gmail.com>"]
license = "MIT"
repository = "https://github.com/fazelstudio/notron"
edition = "2021"

[lib]
name = "notron_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
toml = "0.8"
walkdir = "2"
encoding_rs = "0.8"
r2d2 = "0.8"
r2d2_sqlite = "0.24"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = { version = "2.5.1", features = ["watch"] }
tauri-plugin-shell = "2"
tauri-plugin-pty = "0.3.0"
regex = "1"
notify = "6.1.1"
sysinfo = "0.39.3"
tauri-plugin-single-instance = "2.4.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"
chardetng = "1.0.0"
ignore = "0.4.31"
globset = "0.4"
rayon = "1.12.0"
grep = "0.3"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.dev]
incremental = true
debug = 1
opt-level = 0
codegen-units = 256

[profile.dev.package."*"]
debug = false
opt-level = 0

[profile.dev.package.tauri]
opt-level = 1

[profile.dev.package.tauri-runtime]
opt-level = 1

[profile.dev.package.tauri-runtime-wry]
opt-level = 1

[profile.dev.package.wry]
opt-level = 1

[profile.release]
debug = false
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
